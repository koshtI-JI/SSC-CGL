<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Path to CGL 2.0 — Coming Soon</title>
    <meta
      name="description"
      content="Naya look. Naye features. Aur zyada smart SSC CGL preparation — jald aa raha hai."
    />
    <meta property="og:title" content="Path to CGL 2.0 — Coming Soon" />
    <meta
      property="og:description"
      content="Naya look. Naye features. Aur zyada smart SSC CGL preparation — jald aa raha hai."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#070b14" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Plus+Jakarta+Sans:wght@700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        max-width: 100%;
        overflow-x: clip;
        background: #070b14;
      }
      body {
        position: relative;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 5rem 1.5rem;
        background: #070b14;
        color: #f8fafc;
        font-family: "DM Sans", system-ui, -apple-system, sans-serif;
        text-align: center;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }
      .grid {
        position: fixed;
        inset: 0;
        pointer-events: none;
        opacity: 0.22;
        background-image:
          linear-gradient(to right, rgba(148, 163, 184, 0.14) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(148, 163, 184, 0.14) 1px, transparent 1px);
        background-size: 64px 64px;
        -webkit-mask-image: radial-gradient(ellipse 62% 54% at 50% 48%, #000 25%, transparent 100%);
        mask-image: radial-gradient(ellipse 62% 54% at 50% 48%, #000 25%, transparent 100%);
      }
      .aura-1,
      .aura-2 {
        position: fixed;
        pointer-events: none;
        border-radius: 9999px;
        filter: blur(64px);
      }
      .aura-1 {
        left: 50%;
        top: 44%;
        width: min(48rem, 115vw);
        height: 34rem;
        background: radial-gradient(
          ellipse at center,
          rgba(37, 99, 235, 0.28) 0%,
          rgba(56, 189, 248, 0.1) 42%,
          transparent 72%
        );
        animation: auraDrift 13s ease-in-out infinite;
      }
      .aura-2 {
        left: 54%;
        top: 56%;
        width: min(32rem, 95vw);
        height: 22rem;
        background: radial-gradient(
          ellipse at center,
          rgba(245, 158, 11, 0.11) 0%,
          rgba(30, 64, 175, 0.12) 48%,
          transparent 74%
        );
        animation: auraDrift 17s ease-in-out -5s infinite reverse;
      }
      .motes {
        position: fixed;
        inset: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .mote {
        position: absolute;
        border-radius: 9999px;
      }
      .mote-1 {
        left: 18%;
        top: 28%;
        width: 4px;
        height: 4px;
        background: rgba(125, 211, 252, 0.75);
        box-shadow: 0 0 12px rgba(125, 211, 252, 0.85);
        animation: moteFloat 7.5s ease-in-out infinite;
      }
      .mote-2 {
        right: 20%;
        top: 32%;
        width: 6px;
        height: 6px;
        background: rgba(96, 165, 250, 0.65);
        box-shadow: 0 0 14px rgba(96, 165, 250, 0.8);
        animation: moteFloat 9.2s ease-in-out -3s infinite;
      }
      .mote-3 {
        left: 28%;
        bottom: 26%;
        width: 4px;
        height: 4px;
        background: rgba(252, 211, 77, 0.65);
        box-shadow: 0 0 10px rgba(252, 211, 77, 0.75);
        animation: moteFloat 11s ease-in-out -6s infinite;
      }
      .mote-4 {
        right: 26%;
        bottom: 28%;
        width: 4px;
        height: 4px;
        background: rgba(186, 230, 253, 0.55);
        box-shadow: 0 0 10px rgba(186, 230, 253, 0.7);
        animation: moteFloat 8.4s ease-in-out -1.5s infinite;
      }
      main {
        position: relative;
        z-index: 10;
        width: 100%;
        max-width: 56rem;
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .horizon {
        position: relative;
        height: 1px;
        overflow: hidden;
      }
      .horizon-top {
        width: min(16rem, 62vw);
        margin-bottom: 2.5rem;
        background: linear-gradient(90deg, transparent, rgba(96, 165, 250, 0.65), transparent);
        animation: lineExpand 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.05s both;
      }
      .horizon-bottom {
        width: min(12rem, 48vw);
        margin-top: 2.75rem;
        background: linear-gradient(90deg, transparent, rgba(71, 85, 105, 0.8), transparent);
        animation: lineExpand 1.1s cubic-bezier(0.16, 1, 0.3, 1) 0.92s both;
      }
      .beam {
        position: absolute;
        inset: 0 auto 0 0;
        width: 34%;
        background: linear-gradient(90deg, transparent, #ffffff, transparent);
        animation: beamGlide 4.2s cubic-bezier(0.4, 0, 0.2, 1) 0.8s infinite;
      }
      .horizon-bottom .beam {
        background: linear-gradient(90deg, transparent, rgba(125, 211, 252, 0.9), transparent);
      }
      h1 {
        font-family: "Plus Jakarta Sans", system-ui, -apple-system, sans-serif;
        font-size: clamp(2.35rem, 5.4vw, 4.5rem);
        font-weight: 800;
        line-height: 1.09;
        letter-spacing: -0.03em;
        color: #ffffff;
        text-wrap: balance;
      }
      .line-mask {
        display: block;
        overflow: hidden;
        padding-bottom: 0.14em;
      }
      .rise-1 {
        display: inline-block;
        animation: maskRise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.12s both;
      }
      .rise-2 {
        display: inline-block;
        color: rgba(241, 245, 249, 0.95);
        animation: maskRise 0.95s cubic-bezier(0.16, 1, 0.3, 1) 0.28s both;
      }
      .version {
        display: inline-block;
        background-image: linear-gradient(
          110deg,
          #60a5fa 0%,
          #93c5fd 28%,
          #ffffff 48%,
          #f59e0b 54%,
          #38bdf8 72%,
          #60a5fa 100%
        );
        background-size: 240% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: sheen 4.8s ease-in-out 1.1s infinite;
      }
      .subtext {
        margin-top: 1.75rem;
        max-width: 42rem;
        font-size: clamp(1.05rem, 1.9vw, 1.35rem);
        font-weight: 400;
        line-height: 1.65;
        letter-spacing: -0.01em;
        color: #cbd5e1;
        text-wrap: balance;
      }
      .fade-1 {
        display: inline-block;
        font-weight: 500;
        color: #ffffff;
        animation: fadeUp 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.52s both;
      }
      .fade-2 {
        display: inline-block;
        font-weight: 500;
        color: #bae6fd;
        animation: fadeUp 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.68s both;
      }
      .fade-3 {
        display: inline-block;
        color: rgba(203, 213, 225, 0.95);
        animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.84s both;
      }
      @keyframes maskRise {
        0% {
          opacity: 0;
          transform: translateY(108%);
          filter: blur(8px);
        }
        100% {
          opacity: 1;
          transform: translateY(0%);
          filter: blur(0px);
        }
      }
      @keyframes fadeUp {
        0% {
          opacity: 0;
          transform: translateY(18px);
          filter: blur(4px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
          filter: blur(0);
        }
      }
      @keyframes lineExpand {
        0% {
          opacity: 0;
          transform: scaleX(0);
        }
        100% {
          opacity: 1;
          transform: scaleX(1);
        }
      }
      @keyframes sheen {
        0% {
          background-position: 180% 50%;
        }
        100% {
          background-position: -80% 50%;
        }
      }
      @keyframes auraDrift {
        0%,
        100% {
          transform: translate(-50%, -50%) scale(1) rotate(0deg);
          opacity: 0.72;
        }
        50% {
          transform: translate(-48%, -53%) scale(1.09) rotate(4deg);
          opacity: 1;
        }
      }
      @keyframes beamGlide {
        0% {
          transform: translateX(-120%);
          opacity: 0;
        }
        20% {
          opacity: 1;
        }
        80% {
          opacity: 1;
        }
        100% {
          transform: translateX(260%);
          opacity: 0;
        }
      }
      @keyframes moteFloat {
        0%,
        100% {
          transform: translateY(0) translateX(0);
          opacity: 0.25;
        }
        50% {
          transform: translateY(-18px) translateX(6px);
          opacity: 0.75;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          opacity: 1 !important;
          transform: none !important;
          filter: none !important;
        }
      }
    </style>
    <script>
      (function () {
        try {
          var sw =
            'serviceWorker' in navigator
              ? navigator.serviceWorker
                  .getRegistrations()
                  .then(function (r) {
                    if (!r || !r.length) return false;
                    return Promise.all(
                      r.map(function (x) {
                        return x.unregister().catch(function () {
                          return false;
                        });
                      })
                    ).then(function () {
                      return true;
                    });
                  })
                  .catch(function () {
                    return false;
                  })
              : Promise.resolve(false);

          var c =
            'caches' in window
              ? caches
                  .keys()
                  .then(function (k) {
                    if (!k || !k.length) return false;
                    return Promise.all(
                      k.map(function (x) {
                        return caches.delete(x).catch(function () {
                          return false;
                        });
                      })
                    ).then(function () {
                      return true;
                    });
                  })
                  .catch(function () {
                    return false;
                  })
              : Promise.resolve(false);

          Promise.all([sw, c]).then(function (res) {
            if ((res[0] || res[1]) && !sessionStorage.getItem('getcgl_sw_cleaned_v2')) {
              sessionStorage.setItem('getcgl_sw_cleaned_v2', '1');
              location.reload();
            }
          });
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div class="grid" aria-hidden="true"></div>
    <div class="aura-1" aria-hidden="true"></div>
    <div class="aura-2" aria-hidden="true"></div>
    <div class="motes" aria-hidden="true">
      <span class="mote mote-1"></span>
      <span class="mote mote-2"></span>
      <span class="mote mote-3"></span>
      <span class="mote mote-4"></span>
    </div>
    <main aria-label="Path to CGL 2.0 Launch Announcement">
      <div class="horizon horizon-top" aria-hidden="true"><span class="beam"></span></div>
      <h1>
        <span class="line-mask"><span class="rise-1">Path to CGL <span class="version">2.0</span></span></span>
        <span class="line-mask"><span class="rise-2">is Coming Soon</span></span>
      </h1>
      <p class="subtext">
        <span class="fade-1">Naya look.</span>
        <span class="fade-2">Naye features.</span>
        <span class="fade-3">Aur zyada smart SSC CGL preparation — jald aa raha hai.</span>
      </p>
      <div class="horizon horizon-bottom" aria-hidden="true"><span class="beam"></span></div>
    </main>
  </body>
</html>
