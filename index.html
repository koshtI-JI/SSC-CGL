<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Path to CGL 2.0 — Coming Soon</title>
    <meta
      name="description"
      content="Naya look. Naye features. Aur zyada smart SSC CGL preparation — jald aa raha hai."
    />
    <meta property="og:title" content="Path to CGL 2.0 — Coming Soon" />
    <meta
      property="og:description"
      content="Naya look. Naye features. Aur zyada smart SSC CGL preparation — jald aa raha hai."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#1e3a8a" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('getcgl_theme_v1');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}

        // Remove any legacy Service Workers & Cache Storage so users always get fresh updates
        try {
          var swPromise =
            'serviceWorker' in navigator
              ? navigator.serviceWorker
                  .getRegistrations()
                  .then(function (regs) {
                    if (!regs || !regs.length) return false;
                    return Promise.all(
                      regs.map(function (reg) {
                        return reg.unregister().catch(function () {
                          return false;
                        });
                      })
                    ).then(function () {
                      return true;
                    });
                  })
                  .catch(function () {
                    return false;
                  })
              : Promise.resolve(false);

          var cachePromise =
            'caches' in window
              ? caches
                  .keys()
                  .then(function (keys) {
                    if (!keys || !keys.length) return false;
                    return Promise.all(
                      keys.map(function (k) {
                        return caches.delete(k).catch(function () {
                          return false;
                        });
                      })
                    ).then(function () {
                      return true;
                    });
                  })
                  .catch(function () {
                    return false;
                  })
              : Promise.resolve(false);

          Promise.all([swPromise, cachePromise]).then(function (results) {
            var clearedAny = Boolean(results[0] || results[1]);
            if (clearedAny) {
              try {
                if (!sessionStorage.getItem('getcgl_sw_cleaned_v2')) {
                  sessionStorage.setItem('getcgl_sw_cleaned_v2', '1');
                  window.location.reload();
                }
              } catch (e) {}
            }
          });
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#f4f6f8] text-[#0f172a] dark:bg-[#0b0f17] dark:text-[#e5e7eb] antialiased transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
