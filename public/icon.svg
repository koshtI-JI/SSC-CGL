    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <path
    d="M68 35 H87 V54"
    stroke="url(#pathGrad)"
    stroke-width="7.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Golden Apex Star / Diamond -->
  <path
    d="M87 21 L90.2 27.8 L97 31 L90.2 34.2 L87 41 L83.8 34.2 L77 31 L83.8 27.8 Z"
